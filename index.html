<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="header-row">
      <h1 class="game-title">TETRIS</h1>
      <label class="theme-switch" for="theme-toggle" title="Cambiar modo claro/oscuro">
        <input type="checkbox" id="theme-toggle" aria-label="Cambiar modo claro/oscuro" />
        <span class="slider"></span>
      </label>
    </div>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div class="highscores-panel">
          <h3 class="panel-subtitle">Top 5 Récords</h3>
          <ol id="overlay-highscore-list" class="highscore-list"></ol>
        </div>
        <div id="name-entry" class="name-entry hidden">
          <label for="player-name">¡Nuevo récord! Ingresa tu nombre:</label>
          <div class="name-entry-row">
            <input type="text" id="player-name" maxlength="12" placeholder="Nombre" autocomplete="off" />
            <button id="save-name-btn">Guardar</button>
          </div>
        </div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="start-screen" class="overlay">
      <div class="overlay-box start-box">
        <h2 class="start-title">TETRIS</h2>
        <div class="highscores-panel">
          <h3 class="panel-subtitle">Top 5 Récords</h3>
          <ol id="start-highscore-list" class="highscore-list"></ol>
        </div>
        <div class="global-stats">
          <span>Mejor combo: <strong id="start-best-combo">0</strong></span>
          <span>Líneas máximas: <strong id="start-max-lines">0</strong></span>
        </div>
        <div class="start-actions">
          <button id="play-btn">Jugar</button>
          <button id="reset-scores-btn" class="secondary-btn">Resetear récords</button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
